name: medical-rag

services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [knowledge-web, agent-web, evaluation-web, knowledge-api, agent-api, evaluation-api]

  knowledge-web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP_NAME: knowledge-web
        APP_BASE: knowledge
  agent-web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP_NAME: agent-web
        APP_BASE: agent
  evaluation-web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP_NAME: evaluation-web
        APP_BASE: evaluation

  knowledge-api:
    build:
      context: ../..
      dockerfile: services/knowledge-api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://knowledge:knowledge@knowledge-db:5432/knowledge_db
      ALLOWED_ORIGINS: '["http://localhost:8080"]'
      WORKSPACE_ROOT: /data
      QDRANT_URL: http://qdrant:6333
      TASK_WORKER_ENABLED: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      MEDCPT_CACHE_DIR: /data/models/medcpt
    volumes:
      - knowledge-files:/data
      - type: bind
        source: ${USERPROFILE}/.mineru
        target: /root/.mineru
    depends_on:
      knowledge-db:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30

  knowledge-worker:
    build:
      context: ../..
      dockerfile: services/knowledge-api/Dockerfile
    command: ["python", "-m", "knowledge_api.worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://knowledge:knowledge@knowledge-db:5432/knowledge_db
      WORKSPACE_ROOT: /data
      QDRANT_URL: http://qdrant:6333
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      TASK_WORKER_ENABLED: "true"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      MEDCPT_CACHE_DIR: /data/models/medcpt
    volumes:
      - knowledge-files:/data
      - type: bind
        source: ${USERPROFILE}/.mineru
        target: /root/.mineru
    depends_on:
      knowledge-api:
        condition: service_healthy
      qdrant:
        condition: service_started

  agent-api:
    build:
      context: ../..
      dockerfile: services/agent-api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://agent:agent@agent-db:5432/agent_db
      ALLOWED_ORIGINS: '["http://localhost:8080"]'
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_ENCRYPTION_KEY: ${MODEL_ENCRYPTION_KEY:-}
      MCP_SERVERS_JSON: ${MCP_SERVERS_JSON:-[]}
      MAX_TOOL_ROUNDS: ${MAX_TOOL_ROUNDS:-8}
      WORKSPACE_ROOT: /data
      DEFAULT_KNOWLEDGE_BASE_ID: ${DEFAULT_KNOWLEDGE_BASE_ID:-}
      DAILY_REQUEST_QUOTA: ${DAILY_REQUEST_QUOTA:-100}
      AUTH_ENABLED: ${AGENT_AUTH_ENABLED:-false}
      API_KEYS_JSON: ${AGENT_API_KEYS_JSON:-{}}
    volumes:
      - agent-runtime:/data
    depends_on:
      agent-db:
        condition: service_healthy

  evaluation-api:
    build:
      context: ../..
      dockerfile: services/evaluation-api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://evaluation:evaluation@evaluation-db:5432/evaluation_db
      REDIS_URL: redis://redis:6379/0
      KNOWLEDGE_API_URL: http://knowledge-api:8001
      AGENT_API_URL: http://agent-api:8002
      ALLOWED_ORIGINS: '["http://localhost:8080"]'
      REQUEST_TIMEOUT_SECONDS: ${EVALUATION_REQUEST_TIMEOUT_SECONDS:-300}
      EVALUATION_DISPATCHER_ENABLED: "true"
    depends_on:
      evaluation-db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30

  evaluation-worker:
    build:
      context: ../..
      dockerfile: services/evaluation-api/Dockerfile
    command: ["celery", "-A", "evaluation_api.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://evaluation:evaluation@evaluation-db:5432/evaluation_db
      REDIS_URL: redis://redis:6379/0
      KNOWLEDGE_API_URL: http://knowledge-api:8001
      AGENT_API_URL: http://agent-api:8002
      REQUEST_TIMEOUT_SECONDS: ${EVALUATION_REQUEST_TIMEOUT_SECONDS:-300}
      EVALUATION_DISPATCHER_ENABLED: "false"
      EVALUATION_STALE_SECONDS: ${EVALUATION_STALE_SECONDS:-900}
      EVALUATION_TASK_MAX_RETRIES: ${EVALUATION_TASK_MAX_RETRIES:-3}
    depends_on:
      evaluation-api:
        condition: service_healthy
      redis:
        condition: service_started

  knowledge-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledge_db
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["knowledge-db:/var/lib/postgresql/data"]

  agent-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_db
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["agent-db:/var/lib/postgresql/data"]

  evaluation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evaluation_db
      POSTGRES_USER: evaluation
      POSTGRES_PASSWORD: evaluation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluation -d evaluation_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["evaluation-db:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    volumes: ["redis-data:/data"]

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes: ["qdrant-data:/qdrant/storage"]

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [knowledge-api, agent-api, evaluation-api]

volumes:
  knowledge-db:
  agent-db:
  evaluation-db:
  redis-data:
  qdrant-data:
  knowledge-files:
  agent-runtime:
  prometheus-data:

