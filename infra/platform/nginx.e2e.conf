events {}

http {
  server {
    listen 8080;

    location = / { return 302 /knowledge/; }
    location /knowledge/ { proxy_pass http://knowledge-web; }
    location /agent/ { proxy_pass http://agent-web; }
    location /evaluation/ { proxy_pass http://evaluation-web; }

    location /api/ {
      default_type application/json;
      return 404 '{"detail":"API is mocked by Playwright in frontend acceptance tests"}';
    }
  }
}
