global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: medical-knowledge-api
    static_configs:
      - targets: ["knowledge-api:8001"]
  - job_name: medical-agent-api
    static_configs:
      - targets: ["agent-api:8002"]
  - job_name: medical-evaluation-api
    static_configs:
      - targets: ["evaluation-api:8003"]
