events {}

http {
  upstream knowledge_web { server knowledge-web:80; }
  upstream agent_web { server agent-web:80; }
  upstream evaluation_web { server evaluation-web:80; }
  upstream knowledge_api { server knowledge-api:8001; }
  upstream agent_api { server agent-api:8002; }
  upstream evaluation_api { server evaluation-api:8003; }

  server {
    listen 8080;
    client_max_body_size 100m;

    location = / { return 302 /knowledge/; }
    location /knowledge/ { proxy_pass http://knowledge_web; }
    location /agent/ { proxy_pass http://agent_web; }
    location /evaluation/ { proxy_pass http://evaluation_web; }

    location = /mcp { return 308 /mcp/; }

    location /mcp/ {
      proxy_pass http://knowledge_api;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /api/knowledge/ {
      proxy_pass http://knowledge_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/agent/ {
      proxy_pass http://agent_api/;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/evaluation/ {
      proxy_pass http://evaluation_api/;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 600s;
      proxy_send_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}

