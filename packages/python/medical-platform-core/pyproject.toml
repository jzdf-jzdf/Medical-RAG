[project]
name = "medical-platform-core"
version = "0.1.0"
description = "Stable cross-cutting infrastructure for Medical RAG services"
requires-python = ">=3.12"
dependencies = ["prometheus-client>=0.21,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_platform_core"]
