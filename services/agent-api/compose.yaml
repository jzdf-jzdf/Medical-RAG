services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_db
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["agent-db:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:agent@db:5432/agent_db
    ports: ["8002:8002"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  agent-db:

