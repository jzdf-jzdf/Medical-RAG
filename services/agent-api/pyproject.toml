[project]
name = "medical-agent-api"
version = "0.1.0"
description = "Auditable multi-MCP medical agent service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "cryptography>=44,<51",
  "deepseek-harness-sdk>=0.1.5rc1,<0.2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "httpx2>=2.13,<3",
  "mcp>=2.3,<3",
  "medical-platform-core==0.1.0",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sse-starlette>=3,<4",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
medical-platform-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_api"]

