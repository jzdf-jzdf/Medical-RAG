services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledge_db
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["knowledge-db:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://knowledge:knowledge@db:5432/knowledge_db
    ports: ["8001:8001"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  knowledge-db:

