[project]
name = "medical-knowledge-api"
version = "0.1.0"
description = "Knowledge service for the intracerebral hemorrhage RAG platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "huggingface-hub>=0.26,<2",
  "mcp>=2.3,<3",
  "medical-platform-core==0.1.0",
  "mineru>=4.0,<5",
  "openai>=1,<3",
  "PyYAML>=6,<7",
  "pydantic-settings>=2.6,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "torch>=2.5,<3",
  "transformers>=4.46,<5",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# The service ships Windows native and Linux Docker runtimes. MinerU's macOS
# ARM dependency branch requires a different Transformers major version.
environments = ["sys_platform == 'win32' or sys_platform == 'linux'"]

[tool.uv.sources]
medical-platform-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_api"]

